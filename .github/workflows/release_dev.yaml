# Reusable workflow: build and push a DKNR docker dev image
# Called from each dknr-xxx repository, see README.md of this repository
#
# - builds and pushes <namespace>/<image>:dev to Docker Hub and the Github registry
# - optional extra image (ex: dknr-voice-vosk) built from another folder

name: Build and push docker dev image

on:
  workflow_call:
    inputs:
      namespace:
        description: 'Docker Hub namespace'
        type: string
        default: 'jcpd'
      image:
        description: 'Docker image name (default: repository name)'
        type: string
        default: ''
      extra_context:
        description: 'Folder of an extra image to build (ex: ./docker/vosk)'
        type: string
        default: ''
      extra_suffix:
        description: 'Suffix of the extra image name (ex: vosk)'
        type: string
        default: ''

jobs:
  do_image:
    name: Build and push docker dev image
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: write
      attestations: write
      id-token: write
    env:
      DKNR_NAMESPACE: ${{ inputs.namespace }}
    steps:
      - name: Set image names
        run: |
          IMAGE='${{ inputs.image }}'
          [ -n "$IMAGE" ] || IMAGE="${GITHUB_REPOSITORY#*/}"
          echo "DKNR_IMAGE=${IMAGE,,}" >> $GITHUB_ENV
          echo "GITHUB_REPOSITORY=${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

      - name: Check out the repo
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Log in to Github registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push images
        uses: docker/build-push-action@v7
        with:
          context: .
          sbom: true
          push: true
          tags: |
            ${{ env.DKNR_NAMESPACE }}/${{ env.DKNR_IMAGE }}:dev
            ghcr.io/${{ env.GITHUB_REPOSITORY }}:dev
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          no-cache: true

      - name: Build and push extra image
        if: inputs.extra_context != ''
        uses: docker/build-push-action@v7
        with:
          context: ${{ inputs.extra_context }}
          push: true
          tags: |
            ${{ env.DKNR_NAMESPACE }}/${{ env.DKNR_IMAGE }}-${{ inputs.extra_suffix }}:dev
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          no-cache: true

      - name: Docker Scout unstable
        id: docker-scout
        uses: docker/scout-action@v1.29.0
        with:
          command: environment,quickview,cves
          image: ${{ env.DKNR_NAMESPACE }}/${{ env.DKNR_IMAGE }}:dev
          environment: unstable
          organization: ${{ env.DKNR_NAMESPACE }}
          write-comment: true
          github-token: ${{ secrets.GITHUB_TOKEN }}
